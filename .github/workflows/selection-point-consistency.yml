name: Selection Point consistency
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install state parser
        run: python -m pip install -r scripts/requirements.txt
      - name: Check generated state views
        run: python scripts/render_project_status.py --check
      - name: Check project consistency
        run: python scripts/check_project_consistency.py
      - name: Test drift detection
        run: python -m unittest discover -s tests -v

constraints:
  lab_does_not_open_phase_4_to_8: true
  lab_does_not_modify_canon_directly: true
  product_language_is_hypothesis_until_tested: true
  no_course_or_app_definition_in_lab_0: true
  no_public_content_experiment_in_lab_0: true
  no_external_user_pilot_in_lab_0: true
  owner_self_pilot_allowed: true
  no_efficacy_claim_without_evidence: true
  do_not_open_SP_LAB_002_without_explicit_owner_direction: true
  no_medical_claims_from_body_pilot: true
  do_not_reduce_day_to_binary_success_failure: true
  selected_continuation_not_equal_realized_continuation: true
  conscious_non_action_may_be_realized_continuation: true
  partial_execution_is_partial_test: true
  selected_realized_gap_is_data_not_moral_failure: true
  no_composite_selection_capacity_score_without_validation: true

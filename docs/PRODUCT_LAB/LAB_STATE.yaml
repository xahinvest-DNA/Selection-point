phase_exit_criteria:
  LAB-0:
    - product thesis is explicit and falsifiable enough for discovery
    - canonical-to-product bridge is defined at skeleton level
    - initial hypothesis register exists
    - research sequence is defined
    - owner self-pilot has a traceable event model and measurement specification
    - evidence node is synchronized with current Project Control Plane contract
    - no conflict with current Phase 3 governance remains


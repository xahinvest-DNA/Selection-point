owner_direction:
  decision_date: 2026-09-12
  decision: "Resume Product Lab through an owner self-pilot without opening SP-LAB-002. Use the body/health/physical-efficiency domain as the first real Reality Loop. Prioritize Trajectory Engine, Choice-to-Action evidence and multi-timeframe visibility. Adopt reminder Mode B: 21:30 Review+Plan, morning Plan Recall, midday Trajectory Check."

latest_owner_decision:
  decision_date: 2026-09-15
  decision: "Synchronize Selection-point and Selection-point-health-lab as one project with different internal authority/evidence levels. Establish a Project Control Plane, register Health Lab as a private evidence node, keep historical raw records immutable, align future Health Lab capture with RC-018/event-model/metrics contracts, and return to detailed pilot design only after synchronization. Do not open Stage 5, SP-LAB-002 or an external pilot."

project_system:
  control_plane_state: "docs/PROJECT_SYSTEM/PROJECT_SYSTEM_STATE.yaml"
  control_plane_document: "docs/PROJECT_SYSTEM/PROJECT_CONTROL_PLANE.md"
  sync_protocol: "docs/PROJECT_SYSTEM/CROSS_REPO_SYNC_PROTOCOL.md"
  health_node_contract: "docs/PROJECT_SYSTEM/HEALTH_LAB_NODE_CONTRACT.md"
  health_node:
    node_id: SP-HLAB-001
    repository: xahinvest-DNA/Selection-point-health-lab
    visibility: private
    role: private_evidence_node
    local_state: "docs/NODE_STATE.yaml"
    status: active_owner_self_pilot
  authority_rule: "Evidence nodes may specialize capture and analysis but may not redefine Product Lab or canonical meaning automatically."
  upward_promotion_rule: "Only de-identified reviewed findings, contradictions and falsification signals may move upward; raw personal data remain in the private evidence node."

approved_working_model:
  product_frame: "Selection Point may be presented and tested as a trainer of the capacity to choose."
  selection_capacity: "The capacity to preserve or restore participation in one's own action so that relevant reality can still change the model, the next move and, when necessary, the direction itself."
  short_formula: "Реальность всё ещё может тебя поправить."
  key_research_object: "automatic closure"
  minimal_principle: "A meaningful mismatch retains the possibility to affect subsequent action."
  mastery_rule: "A single successful episode is insufficient; future validation must examine repeatability, autonomy, context transfer, feedback sensitivity and, where feasible, retention."

current_product_direction:
  stronger_frame: "A system that connects local choice to trajectory over time and tests the choice through realized continuation and observable consequences."
  core_chain: "fact -> trajectory -> forecast -> selection point -> selected continuation -> realized continuation -> consequence -> observed feedback -> model update"
  critical_rule: "Selected continuation is not equivalent to realized continuation. An internal choice remains a real event, but it is not counted as executed until the actual continuation is observed. Conscious non-action may itself be a realized continuation; partial execution is a partial test."
  current_priority: "Reality Loop"
  later_priority: "Simulator Loop / serious game after Reality Loop value is demonstrated"
  p0:
    - Trajectory Engine
    - Selected-to-Realized Continuation Evidence
    - multi-timeframe view: episode -> day -> week -> month -> quarter
  p1:
    - conditional current/target trajectory and required change
    - Selection Point Detector
    - body domain as first validation environment
  visualization_hypothesis: "OHLC may be used only as a time-aggregation visualization after an empirically defensible underlying measure exists; it is not an ontology/model of a person."

measurement_foundation:
  event_model: "docs/PRODUCT_LAB/REALITY_EVENT_MODEL_V0_2.md"
  metrics_spec: "docs/PRODUCT_LAB/PILOT_METRICS_SPEC_V0_1.md"
  participant_data_policy: "docs/PRODUCT_LAB/PARTICIPANT_DATA_POLICY_V0_1.md"
  composite_selection_score_allowed: false
  raw_participant_data_in_public_repo_allowed: false
  prompt_exposure_must_be_recorded: true
  measurement_adherence_is_domain_outcome: false

daily_trajectory_questionnaire:
  id: SP-DTQ-002
  status: draft_for_owner_review
  document: "docs/PRODUCT_LAB/DAILY_TRAJECTORY_QUESTIONNAIRE_V0_2.md"
  role: longitudinal_trajectory_telemetry
  cadence: once_daily_evening
  target_burden: "2-4 minutes"
  multi_timeframe_target: "episode -> day -> week -> month -> quarter -> 6M/1Y"
  composite_score: forbidden
  measurement_reactivity_visible: true
  course_mastery_measure: false

active_pilot:
  id: SP-LAB-PILOT-001
  document: "docs/PRODUCT_LAB/PERSONAL_TRAJECTORY_PILOT_V0.md"
  status: active
  type: owner_self_pilot
  evidence_node: SP-HLAB-001
  evidence_repository: xahinvest-DNA/Selection-point-health-lab
  domain: "body / health / physical efficiency"
  goal: "Create a system in which the body preserves health and increases functional efficiency."
  data_entry_constraint: "New reflective data can be entered once per day in the evening."
  reminder_mode: B
  schedule:
    evening: "21:30 Review + Plan"
    morning: "Plan Recall — return yesterday's decision and first physical steps; do not reopen the whole decision"
    midday: "Trajectory Check — on plan / circumstances changed / automatic mode"
  plan_limit: 3
  event_model: "PositionSnapshot -> SelectionPointEvent -> ChoiceRecord -> RealizationRecord -> ConsequenceRecord -> FeedbackRecord -> ModelUpdateRecord"
  legacy_raw_period:
    start: 2026-09-12
    end: 2026-09-14
    rule: "Preserve as captured; do not rewrite to v0.2. Normalize only in a derived layer with source traceability and unknown/not_observed for missing fields."

pilot_metrics_candidates:
  - Selected-to-Realized Continuation Rate
  - Plan Recall Loss
  - Prompted vs Unprompted Realization
  - Recovery Latency
  - Selected-to-Realized Gap Reasons
  - Repeated Selection-Point Patterns


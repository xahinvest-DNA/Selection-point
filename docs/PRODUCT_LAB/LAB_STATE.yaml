new_chat_bootstrap:
  read_in_order:
    - "docs/PRODUCT_LAB/LAB_STATE.yaml"
    - "docs/PRODUCT_LAB/PERSONAL_TRAJECTORY_PILOT_V0.md"
    - "docs/PRODUCT_LAB/SP_LAB_001_SYNTHESIS.md"
    - "docs/PRODUCT_LAB/DECISION_LOG.md"
  instruction: "Do not open SP-LAB-002 automatically. Continue SP-LAB-PILOT-001 unless the owner explicitly changes direction."

constraints:
  lab_does_not_open_phase_4_to_8: true
  lab_does_not_modify_canon_directly: true
  product_language_is_hypothesis_until_tested: true
  no_course_or_app_definition_in_lab_0: true
  no_public_content_experiment_in_lab_0: true
  no_external_user_pilot_in_lab_0: true
  owner_self_pilot_allowed: true
  no_efficacy_claim_without_evidence: true
  do_not_open_SP_LAB_002_without_explicit_owner_direction: true
  no_medical_claims_from_body_pilot: true
  do_not_reduce_day_to_binary_success_failure: true

phase_exit_criteria:
  LAB-0:
    - product thesis is explicit and falsifiable enough for discovery
    - canonical-to-product bridge is defined at skeleton level
    - initial hypothesis register exists
    - research sequence is defined
    - no conflict with current Phase 3 governance remains

sp_lab_002_gate:
  candidate: SP-LAB-002
  status: unopened
  open_only_after_explicit_owner_direction: true

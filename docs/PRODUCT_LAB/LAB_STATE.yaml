schema_version: 4
lab: Selection Point Product Lab
updated_at: '2026-11-03'
status: active_design_no_external_pilot
phase: LAB-0
last_approved_gate: SP-LAB-001
next_gate: SP-LAB-002
next_gate_status: unopened
external_user_pilot_status: unopened

owner_decision:
  id: SP-PSYS-004
  date: '2026-11-03'
  status: approved
  decision: docs/PROJECT_SYSTEM/DECISION_ENVIRONMENT_FIRST_RESET_2026-11-03.md
  summary: >-
    Replace course-first development with an environment-first product route. Build a
    minimal adaptive selection environment whose mechanism is repeated representative
    situations, consequences, feedback and separately observed real-world transfer.

active_product_thesis:
  id: SP-LAB-THESIS-002
  document: docs/PRODUCT_LAB/PRODUCT_THESIS.md
  product_form: adaptive_selection_environment
  primary_mechanism: repeated_experience_consequence_feedback_and_transfer
  theory_is_primary_mechanism: false
  hidden_correct_answer_target: false

active_architecture:
  id: SP-AEA-001
  document: docs/PRODUCT_LAB/ADAPTIVE_ENVIRONMENT_ARCHITECTURE_V0.md
  status: approved_direction_working_architecture
  validation_status: unvalidated

v0_scope:
  domain: effective_body
  target_capabilities: 1
  scenario_count_min: 10
  scenario_count_max: 15
  real_world_transfer_experiments: 1
  manual_delivery_allowed: true
  software_required: false
  vr_required: false
  ai_required: false
  full_course_required: false
  external_pilot_authorized: false

current_priority:
  first: define_single_v0_capability
  second: define_scenario_grammar
  third: define_transfer_evidence_boundary
  after_owner_review: build_manual_v0_if_approved

loops:
  simulation_loop:
    status: active_design
    chain:
      - representative_situation
      - perceived_position_and_constraints
      - selection_point
      - available_continuations
      - selected_continuation
      - simulated_realization_or_non_realization
      - consequences
      - feedback
      - varied_next_situation
  reality_transfer_loop:
    status: required_for_validation
    chain:
      - simulated_pattern
      - bounded_real_world_experiment
      - factual_realization_or_non_realization
      - real_consequence
      - review
      - next_simulation_update

measurement_foundation:
  reality_event_model: docs/PRODUCT_LAB/REALITY_EVENT_MODEL_V0_2.md
  selected_is_realized: false
  simulator_success_proves_transfer: false
  questionnaire_is_product_mechanism: false
  raw_participant_data_in_public_repo_allowed: false
  fact_self_report_interpretation_must_remain_separate: true
  causal_claims_from_temporal_order_allowed: false

daily_trajectory_questionnaire:
  id: SP-DTQ-002
  status: withdrawn_for_redesign
  role: telemetry_only_if_reintroduced
  automatic_reminders_active: false

course_relationship:
  status: historical_reference
  directory: docs/COURSE
  role:
    - scenario_seeds
    - distinction_library
    - examples
    - language_candidates
    - failure_modes
  course_execution_authorized: false

training_relationship:
  status: reference_input
  directory: docs/TRAINING
  role:
    - capability_candidates
    - progression_hypotheses
    - prompt_fading_hypotheses
    - measurement_constraints
  gate_pipeline_active: false

scientific_boundaries:
  brain_does_not_distinguish_simulation_and_reality_claim_accepted: false
  simulation_can_support_learning_working_hypothesis: true
  immersion_assumed_to_drive_transfer: false
  real_world_transfer_must_be_observed: true
  evidence_source: docs/FOUNDATION/SOURCE_MATERIALS/29_2026-11-03_ADAPTATION_ENVIRONMENT_AND_TRANSFER.md

promotion_boundaries:
  product_lab_does_not_modify_foundation_canon: true
  lab_0_does_not_open_foundation_stage_5: true
  lab_0_does_not_open_external_pilot: true
  health_or_self_pilot_evidence_does_not_auto_promote: true
  external_pilot_requires_owner_decision: true
  software_implementation_requires_owner_decision: true

falsification_signals:
  - simulator_answer_optimization_without_real_transfer
  - improvement_only_while_prompts_present
  - vocabulary_gain_without_practical_difference
  - constant_external_leader_required
  - arbitrary_consequences_prevent_stable_learning
  - platform_required_before_manual_mechanism_test

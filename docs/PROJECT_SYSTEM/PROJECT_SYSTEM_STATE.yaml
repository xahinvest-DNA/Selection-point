    status: approved
    document: docs/TRAINING/STAGE_1_CAPABILITY_SPEC.md
  current_gate: Gate B - Stage 1 Research Packet
  stage_1_research_packet:
    id: SP-TR-S1-RP-001
    status: red_team_complete_owner_review_required
    execution_spec: docs/TRAINING/STAGE_1_RESEARCH_PACKET_SPEC.md
    deliverable: docs/TRAINING/STAGE_1_RESEARCH_PACKET.md
    red_team: docs/TRAINING/STAGE_1_RESEARCH_PACKET_RED_TEAM.md

  owner_decision: "15 сентября 2026 года Андрей явно утвердил сквозную boundary RC-018: внутренне выбранное продолжение не равно фактически реализованному продолжению. Выбор остаётся реальным внутренним событием, но неисполненный выбор нельзя засчитывать как совершённый ход или использовать как будто реальность уже дала feedback на неслучившееся действие. Фактическую траекторию формируют реально произошедшие продолжения — действие, частичное исполнение, сознательно выдержанная пауза/невмешательство либо иное фактическое продолжение — и их последствия. Последствия становятся обратной связью только через замечание, интерпретацию и корректировку следующего цикла. Короткая формула: 'Выбрать ≠ сделать. Сделать ≠ получить желаемое. Последствия ≠ автоматически использованная обратная связь.' RC-018 утверждён как cross-cutting clarification, не как SP-HCM-10. Ступень 4 остаётся завершённой; SP-S5-P01 остаётся unopened."

